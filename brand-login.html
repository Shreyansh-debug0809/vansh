<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | BizGrowth Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      color: #172033;
      background: linear-gradient(145deg, #f8fafc 0%, #e8f2f5 100%);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background: #ffffff;
      border-bottom: 1px solid #dfe7ea;
    }

    .logo {
      color: #2563eb;
      font-size: 1.35rem;
      font-weight: 700;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      color: #475569;
      font-weight: 600;
      text-decoration: none;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: #087e83;
    }

    main {
      display: grid;
      min-height: calc(100vh - 74px);
      place-items: center;
      padding: 36px 16px;
    }

    .signin-panel {
      width: min(100%, 480px);
      padding: 36px;
      border: 1px solid #d8e2e4;
      border-top: 5px solid #087e83;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 14px 35px rgba(24, 53, 65, 0.08);
    }

    .eyebrow {
      margin-bottom: 12px;
      color: #087e83;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 10px;
      color: #102a36;
      font-size: 1.9rem;
      line-height: 1.25;
      text-align: center;
    }

    .intro {
      margin-bottom: 26px;
      color: #566875;
      line-height: 1.6;
      text-align: center;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 18px;
    }

    label {
      color: #263d47;
      font-size: 0.92rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #cbd7da;
      border-radius: 5px;
      background: #ffffff;
      color: #172033;
      font-size: 1rem;
    }

    input:focus {
      border-color: #087e83;
      outline: 3px solid rgba(8, 126, 131, 0.16);
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 5px;
      background: #087e83;
      color: #ffffff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }

    button:hover:not(:disabled) {
      background: #06696d;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 1.5em;
      margin-top: 14px;
      color: #9f2d25;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .register-link {
      display: block;
      margin-top: 18px;
      color: #087e83;
      font-weight: 650;
      text-align: center;
      text-decoration: none;
    }

    .register-link:hover,
    .register-link:focus-visible {
      text-decoration: underline;
    }

    @media (max-width: 560px) {
      nav {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
        padding: 16px 20px;
      }

      .nav-links {
        flex-wrap: wrap;
        gap: 10px 16px;
      }

      .signin-panel {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">BizGrowth Hub</a>
    <div class="nav-links">
      <a href="index.html#about">About Us</a>
      <a href="index.html#contact">Contact</a>
      <a href="assistant.html">Back to options</a>
    </div>
  </nav>

  <main>
    <section class="signin-panel" aria-labelledby="page-title">
      <p class="eyebrow">BizGrowth Hub account</p>
      <h1 id="page-title">Sign in to continue</h1>
      <p class="intro">Use the Gmail address and password you created during registration.</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Gmail address</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@gmail.com" pattern="[a-zA-Z0-9._%+-]+@gmail\.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
        </div>

        <button id="submit-button" type="submit">Sign in</button>
        <p class="status" id="login-status" aria-live="polite"></p>
      </form>

      <a class="register-link" href="assistant.html">New here? Register for an assistant</a>
    </section>
  </main>

  <script>
    const form = document.querySelector('#login-form');
    const submitButton = document.querySelector('#submit-button');
    const statusElement = document.querySelector('#login-status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      submitButton.disabled = true;
      statusElement.textContent = '';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.elements.email.value.trim(),
            password: form.elements.password.value
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Sign-in failed. Check your Gmail and password.');
        window.location.href = 'startup-chat.html';
      } catch (error) {
        statusElement.textContent = error.message || 'Could not sign in. Please try again.';
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
